name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Calculate release version
        id: version
        shell: pwsh
        run: |
          $tag = & .\.github\scripts\get-release-version.ps1
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build:
    needs: version
    environment: release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Require Azure signing credentials
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          foreach ($name in @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Configure the $name secret in the release environment before releasing."
            }
          }
      - name: Build release binaries
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: .\.github\scripts\build-release.ps1 -Version $env:RELEASE_TAG
      - name: Sign Windows executables
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net
          signing-account-name: oh-my-posh
          certificate-profile-name: oh-my-posh
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-azure-cli-credential: true
      - name: Verify Windows signatures
        run: |
          foreach ($arch in @('386', 'amd64', 'arm64')) {
            $path = Join-Path $PWD "dist\windows-$arch.exe"
            $signature = Get-AuthenticodeSignature -LiteralPath $path -ErrorAction Stop
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate) {
              throw "Missing, invalid, or untimestamped Authenticode signature: $path"
            }
          }
      - name: Upload signed binaries
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-binaries
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download signed binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Attest signed release binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist\*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
            throw 'No release binaries were built.'
          }
          & gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            $commit = & gh api "repos/${env:GH_REPO}/commits/${env:RELEASE_TAG}" --jq .sha
            if ($LASTEXITCODE -ne 0 -or $commit -ne $env:RELEASE_COMMIT) {
              throw 'The existing release tag points to a different commit.'
            }
            & gh release upload $env:RELEASE_TAG --clobber -- @assets
          } else {
            $arguments = @('release', 'create', $env:RELEASE_TAG, '--target', $env:RELEASE_COMMIT,
              '--title', "gh-mint $($env:RELEASE_TAG.Substring(1))", '--generate-notes')
            if ($env:RELEASE_TAG.Contains('-')) {
              $arguments += '--prerelease'
            }
            & gh @arguments -- @assets
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Cannot publish release binaries.'
          }
