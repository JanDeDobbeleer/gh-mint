name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Test release versioning
        shell: pwsh
        run: .\.github\scripts\test-release-version.ps1
      - name: Test Windows PowerShell compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: .\.github\scripts\test-release-version.ps1
      - name: Test Windows MSIX packaging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:GOOS = 'windows'
          $env:CGO_ENABLED = '0'
          foreach ($architecture in @('386', 'amd64', 'arm64')) {
            $env:GOARCH = $architecture
            go build -o "dist\mint-windows-$architecture.exe" .
            if ($LASTEXITCODE -ne 0) {
              throw "Windows $architecture build failed."
            }
          }
          .\.github\scripts\build-msix.ps1 -Version v1.0.0
      - name: Install Go analyzers
        run: go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@v0.52.0 golang.org/x/tools/go/analysis/passes/fieldalignment/cmd/fieldalignment@v0.52.0
      - name: Modernize
        run: modernize ./...
      - name: Fieldalignment
        run: fieldalignment ./...
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: gofmt -w .
      - run: git diff --exit-code
      - if: runner.os == 'Linux'
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
